services:
  db:
    container_name: postgres
    image: postgres
    environment:
      POSTGRES_USER: "dev"
      PGDATA: /data/postgres
      POSTGRES_DB: initiative
      POSTGRES_PASSWORD: test
    volumes:
      - db:/data/postgres
    ports:
      - "5432:5432"
    networks:
      - db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d postgres"]
      interval: 30s
      timeout: 10s
      retries: 5
networks:
  db:
    driver: bridge

volumes:
  db:
